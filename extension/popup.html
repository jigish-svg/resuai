<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GetJobFit.in</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #EEF8F6;
      color: #1a2724;
      width: 340px;
      min-height: 200px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(26,39,36,0.08);
      background: white;
    }
    .logo-mark {
      width: 28px; height: 28px;
      background: #CA2E55;
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
    }
    .logo-text { font-weight: 700; font-size: 14px; color: #1a2724; }
    .logo-text span { color: #CA2E55; }
    .body { padding: 16px; }
    .status-detecting {
      display: flex; align-items: center; gap-8px;
      font-size: 13px; color: #5e7a73;
      padding: 12px; text-align: center; justify-content: center;
    }
    .job-card {
      background: white; border: 1px solid rgba(26,39,36,0.10);
      border-radius: 8px; padding: 14px; margin-bottom: 12px;
    }
    .job-title { font-weight: 600; font-size: 14px; margin-bottom: 2px; }
    .job-company { font-size: 12px; color: #5e7a73; margin-bottom: 4px; }
    .job-source { font-size: 11px; color: #8a9fa0; }
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; padding: 10px 16px;
      border-radius: 7px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.88; }
    .btn-primary { background: #48845A; color: white; }
    .btn-secondary { background: rgba(26,39,36,0.06); color: #1a2724; margin-top: 8px; }
    .no-job {
      text-align: center; padding: 20px 16px;
      font-size: 13px; color: #5e7a73; line-height: 1.5;
    }
    .no-job strong { display: block; font-size: 14px; color: #1a2724; margin-bottom: 6px; }
    .footer {
      padding: 10px 16px; border-top: 1px solid rgba(26,39,36,0.08);
      font-size: 11px; color: #8a9fa0; text-align: center;
    }
    .footer a { color: #48845A; text-decoration: none; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #48845A; display: inline-block; margin-right: 6px; }
    .dot.red { background: #80240F; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <div class="logo-text">GetJobFit<span>.in</span></div>
  </div>

  <div class="body">
    <div id="content">
      <div class="no-job">
        <div style="font-size:24px;margin-bottom:8px;">🔍</div>
        <strong>Detecting job…</strong>
        Navigate to a job posting on LinkedIn, Naukri, Indeed, or Glassdoor.
      </div>
    </div>
  </div>

  <div class="footer">
    <a href="https://getjobfit.in/dashboard" target="_blank">Open workspace</a>
    &nbsp;·&nbsp;
    <a href="https://getjobfit.in/features" target="_blank">Learn more</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
